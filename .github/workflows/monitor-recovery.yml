name: Anyrouter Recovery Monitor (Legacy)

# Legacy entry point: use keepalive.yml for the maintained dual-pool chain.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional API base URL"
        required: false
        default: "https://anyrouter.top/v1"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Claude CLI
        run: claude --version
      - name: Run legacy monitor
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          BASE_URL: ${{ inputs.base_url || 'https://anyrouter.top/v1' }}
          MODEL: ${{ vars.ANYROUTER_CLAUDE_MODEL }}
          MAX_DURATION_SEC: 1800
        run: bash scripts/monitor-recovery.sh

name: Anyrouter Keepalive (Once)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional API base URL"
        required: false
        default: "https://anyrouter.top/v1"

permissions:
  contents: read

jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Claude CLI
        run: claude --version
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Verify Codex exec capabilities
        run: |
          codex --version
          codex_help="$(codex exec --help)"
          for flag in --ephemeral --skip-git-repo-check --sandbox --model; do
            grep -F -- "$flag" <<< "$codex_help" >/dev/null || {
              printf 'Codex exec is missing required option: %s\n' "$flag" >&2
              exit 1
            }
          done
      - name: Run one request per pool
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          ANYROUTER_BASE_URL: ${{ inputs.base_url || 'https://anyrouter.top/v1' }}
          ANYROUTER_CLAUDE_MODEL: ${{ vars.ANYROUTER_CLAUDE_MODEL }}
          ANYROUTER_GPT_MODEL: ${{ vars.ANYROUTER_GPT_MODEL }}
          KEEPALIVE_SEC: ${{ vars.ANYROUTER_KEEPALIVE_SEC }}
          MAX_DURATION_SEC: 60
        run: bash scripts/run-dual-pool.sh --mode start --once
